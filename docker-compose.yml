services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ariza-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      LIBREOFFICE_BIN: libreoffice
      TEMPLATES_DIR: "./templates"
      OUTPUT_DIR: "./generated"
    # Share the host's network namespace so the bot can connect to
    # the PostgreSQL instance running NATIVELY on the Ubuntu server
    # at 127.0.0.1:5432 — no need to expose Postgres on the Docker
    # bridge or edit pg_hba.conf. The webhook port (3000) is bound
    # directly to the host as well, so the `ports:` mapping is no
    # longer needed (network_mode: host ignores it).
    network_mode: host
    volumes:
      - ./generated:/app/generated
      - ./templates:/app/templates
