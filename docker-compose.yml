services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ariza-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      LIBREOFFICE_BIN: libreoffice
      TEMPLATES_DIR: "./templates"
      OUTPUT_DIR: "./generated"
    # Map `host.docker.internal` to the Docker host's gateway so the bot
    # container can reach the PostgreSQL instance running NATIVELY on the
    # Ubuntu server (not in a container). DATABASE_URL in .env must use
    # this hostname — see .env.example.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PAYMENT_WEBHOOK_PORT:-3000}:3000" # Click/Payme webhook + QR /download
    volumes:
      - ./generated:/app/generated
      - ./templates:/app/templates
